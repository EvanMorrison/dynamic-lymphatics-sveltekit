<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<!-- Google Fonts: Body + Title (Arimo + Bilbo Swash Caps) -->
		<link
			href="https://fonts.googleapis.com/css2?family=Arimo:wght@100;300;400;500;700;900&family=Bilbo+Swash+Caps&display=swap"
			rel="stylesheet"
		/>

		<!-- Material Symbols Rounded (limited axis range + alphabetical icon_names subset for smallest payload).
		     "phone" → "mobile", "mail_outline" → "mail".
		     "_outline" suffix is a convention handled inside the <Icon> component (not a real ligature).
		  -->
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0..1,0&icon_names=accessibility,account_circle,call,call_split,home,keyboard_arrow_right,mail,menu,pin_drop,spa&display=block"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
